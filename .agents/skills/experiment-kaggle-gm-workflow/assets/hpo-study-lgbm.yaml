# HPO Study Config: LightGBM
# Starter Optuna study for GM workflow Phase 3.
# Copy this file and customize target/run_id for your campaign.
#
# Search space based on NUMERAI_MASTER_MODEL_DESIGN_SPACE.md parameter ranges.
# FIXED: colsample_bytree=0.1 (never tuned for Numerai)
#
# Model params map to LGBMModel in src/numereng/models/lgbm.py:
#   n_estimators, learning_rate, max_depth, num_leaves,
#   subsample, reg_alpha, reg_lambda, min_child_samples

study_name: hpo-lgbm-ender
direction: maximize
metric: sharpe
n_trials: 25

data:
  target: target_ender_20
  feature_set: medium
  dataset_variant: downsampled

model:
  type: lgbm

fixed_params:
  colsample_bytree: 0.1
  subsample_freq: 1
  verbosity: -1
  force_col_wise: true
  device: cpu

search_space:
  n_estimators:
    type: int
    low: 1000
    high: 20000
    log: true
  learning_rate:
    type: float
    low: 0.001
    high: 0.05
    log: true
  max_depth:
    type: int
    low: 4
    high: 10
  num_leaves:
    type: int
    low: 16
    high: 512
    log: true
  subsample:
    type: float
    low: 0.5
    high: 1.0
  reg_alpha:
    type: float
    low: 0.0
    high: 5.0
  reg_lambda:
    type: float
    low: 0.0
    high: 5.0
  min_child_samples:
    type: int
    low: 5
    high: 100

training:
  engine:
    profile: purged_walk_forward
  early_stopping_rounds: 100
