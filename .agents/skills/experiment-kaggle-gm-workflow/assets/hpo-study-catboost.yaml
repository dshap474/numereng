# HPO Study Config: CatBoost
# Starter Optuna study for GM workflow Phase 3.
# Copy this file and customize target/run_id for your campaign.
#
# Search space based on NUMERAI_MASTER_MODEL_DESIGN_SPACE.md parameter ranges.
# FIXED: rsm=0.1 (CatBoost's colsample_bytree equivalent, never tuned)
#
# Model params map to CatBoostModel in src/numereng/models/catboost.py:
#   iterations (n_estimators), learning_rate, depth (max_depth),
#   rsm (colsample_bytree), l2_leaf_reg

study_name: hpo-catboost-ender
direction: maximize
metric: sharpe
n_trials: 25

data:
  target: target_ender_20
  feature_set: medium
  dataset_variant: downsampled

model:
  type: catboost

fixed_params:
  rsm: 0.1
  verbose: 0
  task_type: CPU

search_space:
  iterations:
    type: int
    low: 1000
    high: 10000
    log: true
  learning_rate:
    type: float
    low: 0.001
    high: 0.05
    log: true
  depth:
    type: int
    low: 4
    high: 10
  l2_leaf_reg:
    type: float
    low: 0.1
    high: 10.0
    log: true

training:
  engine:
    profile: purged_walk_forward
  early_stopping_rounds: 100
