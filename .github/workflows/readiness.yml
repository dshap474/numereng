# Run repository readiness checks against Python and packaged Viz artifacts.
#
# USAGE:
#   Triggered for pull requests, main pushes, the weekly schedule, and manual runs.

name: Readiness

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viz/web/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: taiki-e/install-action@just

      - name: Install Python dependencies
        run: uv sync --extra dev --locked

      - name: Install Viz dependencies
        working-directory: viz/web
        run: npm ci

      - name: Install Chromium
        working-directory: viz/web
        run: npx playwright install --with-deps chromium

      - name: Run readiness checks
        run: just readiness
